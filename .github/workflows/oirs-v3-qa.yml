# Archivo QA histórico del prototipo privado V3; no forma parte del flujo principal de publicación del dashboard.
# Solo ejecución manual por decisión técnica expresa; no despliega el Worker ni modifica datos.
name: LEGACY OIRS V3 - QA sintético manual sin despliegue
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias sin scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Sintaxis backend y frontend
        run: |
          node --check worker.js
          node --check ../consulta/app.js
      - name: Pruebas Node sintéticas
        run: npm test
